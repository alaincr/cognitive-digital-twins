name: reasoning-researcher
role: ic
display_name: "Reasoning Researcher"
reports_to: reasoning-lead
adapter:
  type: claude_local
  config:
    model: claude-sonnet-4-6
    cwd: "."
    instructionsFilePath: "./agents/reasoning/reasoning-researcher/soul.md"
    maxTurnsPerRun: 20
    timeoutSec: 300
    env:
      ANTHROPIC_API_KEY:
        secret_ref: ANTHROPIC_API_KEY
heartbeat:
  interval: "0 8,11,14,17 * * *"  # 4x daily
  instructionsFilePath: "./agents/reasoning/reasoning-researcher/heartbeat.md"
permissions:
  - roam_mcp:read
  - roam_mcp:write
  - filesystem:read
  - web:search
  - web:fetch
tools:
  - roam_mcp
  - web_search
  - web_fetch
